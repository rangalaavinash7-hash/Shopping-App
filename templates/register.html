{% extends "base.html" %}

{% block title %}Create Account — ShopFinder{% endblock %}

{% block content %}
<div class="container" style="padding: 4.5rem 0 6rem; max-width: 460px;">
    <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-xl); position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--gradient-hero);"></div>

        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon-wrapper" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1 style="font-size: 1.75rem;">Create an Account</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Start comparing prices and tracking top deals across platforms.</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="regUsername" class="form-control" placeholder="Choose a username" required minlength="3">
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="regSubmitBtn">
                Create Account <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Already registered? <a href="/login" style="color: var(--primary-600); font-weight: 600;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("registerForm");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("regSubmitBtn");
            submitBtn.disabled = true;
            submitBtn.textContent = "Creating Account...";

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("regUsername").value.trim(),
                        email: document.getElementById("regEmail").value.trim(),
                        password: document.getElementById("regPassword").value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast("Account created successfully!", "success");
                    setTimeout(() => window.location.href = "/", 700);
                } else {
                    showToast(data.error || "Registration failed", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `Create Account <i class="bi bi-arrow-right"></i>`;
                }
            } catch (err) {
                showToast("Network error. Please try again.", "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Create Account <i class="bi bi-arrow-right"></i>`;
            }
        });
    });
</script>
{% endblock %}
