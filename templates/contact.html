{% extends "base.html" %}

{% block title %}Contact Support — ShopFinder{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 0 6rem; max-width: 650px;">
    <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-lg);">
        <span style="color: var(--primary-600); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em;">Get in Touch</span>
        <h1 style="font-size: 2rem; margin-top: 0.2rem; margin-bottom: 0.75rem;">Contact ShopFinder Team</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
            Have questions about platform integration or want to suggest a new e-commerce website? Send us a message.
        </p>

        <form id="contactForm" onsubmit="event.preventDefault(); showToast('Thank you for reaching out! We will get back to you shortly.', 'success'); this.reset();">
            <div class="form-group">
                <label class="form-label">Your Name</label>
                <input type="text" class="form-control" required placeholder="Divya Surya">
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" required placeholder="divya@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Subject</label>
                <input type="text" class="form-control" required placeholder="New Shopping Platform Suggestion">
            </div>

            <div class="form-group">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" required placeholder="Describe your query or feedback..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Send Message <i class="bi bi-send-fill"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
