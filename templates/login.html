{% extends "base.html" %}

{% block title %}Sign In — ShopFinder{% endblock %}

{% block content %}
<div class="container" style="padding: 4.5rem 0 6rem; max-width: 460px;">
    <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-xl); position: relative; overflow: hidden;">
        <!-- Top Gradient Strip -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--gradient-hero);"></div>

        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon-wrapper" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-bag-heart-fill"></i>
            </div>
            <h1 style="font-size: 1.75rem;">Welcome Back</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to access your wishlist, alerts, and saved history.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Enter username or email" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="loginSubmitBtn">
                Sign In <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <!-- Quick Demo Credentials Box -->
        <div style="margin-top: 1.75rem; padding: 1rem; background: var(--bg-surface-hover); border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">
                ⚡ One-Click Demo Credentials
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button type="button" class="btn btn-outline btn-sm" id="fillShopperBtn" style="flex: 1; font-size: 0.8rem;">
                    Shopper (shopper)
                </button>
                <button type="button" class="btn btn-outline btn-sm" id="fillAdminBtn" style="flex: 1; font-size: 0.8rem;">
                    Admin (admin)
                </button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? <a href="/register" style="color: var(--primary-600); font-weight: 600;">Register now</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("loginForm");
        const userIn = document.getElementById("loginUsername");
        const passIn = document.getElementById("loginPassword");

        // Quick demo filler buttons
        document.getElementById("fillShopperBtn").onclick = () => {
            userIn.value = "shopper";
            passIn.value = "shop123";
        };
        document.getElementById("fillAdminBtn").onclick = () => {
            userIn.value = "admin";
            passIn.value = "admin123";
        };

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("loginSubmitBtn");
            submitBtn.disabled = true;
            submitBtn.textContent = "Signing In...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: userIn.value.trim(),
                        password: passIn.value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast(data.message, "success");
                    const urlParams = new URLSearchParams(window.location.search);
                    const next = urlParams.get("next") || "/";
                    setTimeout(() => window.location.href = next, 600);
                } else {
                    showToast(data.error || "Login failed", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `Sign In <i class="bi bi-arrow-right"></i>`;
                }
            } catch (err) {
                showToast("Network error. Please try again.", "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Sign In <i class="bi bi-arrow-right"></i>`;
            }
        });
    });
</script>
{% endblock %}
